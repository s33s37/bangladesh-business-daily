name: 孟加拉商业情报日报 - 每日生成

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write    # 关键：赋予写入权限
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 使用内置 token
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: pip install -r requirements.txt
      
      - name: 配置环境变量
        run: echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env
      
      - name: 运行日报生成
        run: python scripts/main.py
      
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/ reports/
          git commit -m "📅 自动更新日报 - $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
